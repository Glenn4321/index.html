<title>Form — træning & kost</title>

<style>
  :root{
    --bg: #F5F1E8;
    --paper: #FFFFFF;
    --ink: #232320;
    --ink-soft: #6B6A63;
    --line: #E1DCCE;
    --rust: #C1553B;
    --rust-dark: #8C3A26;
    --sage: #52684F;
    --sage-dark: #33422F;
    --amber: #A6742B;
    --amber-dark: #6E4C18;
    --danger: #B23A2E;
    --radius: 14px;
    --shadow: 0 1px 0 rgba(35,35,32,0.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;}
  html,body{margin:0; padding:0; background: #DDD6C4; height:100%; overscroll-behavior:none; -webkit-text-size-adjust: 100%; overflow-x:hidden; width:100%;}
  body{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    display:flex; justify-content:center;
    min-height:100vh;
    -webkit-user-select:none; user-select:none;
    overscroll-behavior-y: contain;
  }
  input, textarea{ -webkit-user-select:text; user-select:text; }
  .device{
    width:100%; max-width:430px; min-height:100vh;
    background: var(--bg);
    display:flex; flex-direction:column;
    position:relative;
    overflow-x:hidden;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  header.top{
    padding: 28px 20px 14px;
    display:flex; align-items:baseline; justify-content:space-between;
  }
  .brand{
    font-family:'Bebas Neue', sans-serif;
    font-size: 34px;
    letter-spacing: 0.5px;
    line-height:1;
  }
  .brand span{ color: var(--rust); }
  .datepill{
    font-size:12px; color: var(--ink-soft); font-weight:500;
    text-transform: capitalize;
  }
  .sync-pill{
    font-size:10px; font-weight:600; margin-top:3px; text-transform:uppercase; letter-spacing:.2px;
  }
  .sync-pill.on{ color: var(--sage-dark); }
  .sync-pill.off{ color: var(--ink-soft); }

  .profile-switch{
    display:flex; gap:8px; margin: 0 20px 14px;
  }
  .profile-switch button{
    flex:1; border:1px solid var(--line); background: var(--paper); border-radius: var(--radius);
    padding: 10px 10px; cursor:pointer; text-align:left;
  }
  .profile-switch button .pname{ font-size:13px; font-weight:700; color: var(--ink); }
  .profile-switch button .pmeta{ font-size:11px; color: var(--ink-soft); margin-top:1px; }
  .profile-switch button.active{ border-color: var(--ink); background: var(--ink); }
  .profile-switch button.active .pname{ color:#fff; }
  .profile-switch button.active .pmeta{ color: rgba(255,255,255,0.7); }

  .tabs{
    display:flex; margin: 0 20px 14px; background: var(--paper);
    border-radius: 999px; padding:4px; border:1px solid var(--line);
  }
  .tab{
    flex:1; text-align:center; padding:10px 4px; font-size:14px; font-weight:600;
    border-radius:999px; cursor:pointer; color: var(--ink-soft);
    transition: background .15s ease, color .15s ease;
    user-select:none;
  }
  .tab.active.training{ background: var(--rust); color:#fff; }
  .tab.active.diet{ background: var(--sage); color:#fff; }

  .stats-row{
    display:grid; grid-template-columns: 1fr 1fr; gap:8px;
    margin: 0 20px 14px;
  }
  .stats-row.cols-3{ grid-template-columns: 1fr 1fr 1fr; }
  .stat-card{
    background: var(--paper); border:1px solid var(--line); border-radius: var(--radius);
    padding: 12px 10px;
  }
  .stat-card .num{ font-family:'Bebas Neue', sans-serif; font-size:24px; line-height:1; }
  .stat-card.training .num{ color: var(--rust); }
  .stat-card.diet .num{ color: var(--sage); }
  .stat-card .lbl{ font-size:10px; color: var(--ink-soft); margin-top:3px; font-weight:600; text-transform:uppercase; letter-spacing:.2px; }

  .profile-card{
    background: var(--paper); border:1px solid var(--line); border-radius: var(--radius);
    padding: 16px; margin: 0 20px 14px;
  }
  .profile-card .ptitle{ font-family:'Bebas Neue', sans-serif; font-size:18px; letter-spacing:.3px; margin-bottom:10px; }
  .field-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:11px; color: var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.3px; }
  .field input, .field select{
    border:1px solid var(--line); border-radius:8px; padding:9px 10px;
    font-size:14px; font-weight:600; font-family:inherit; background:#FBF9F4; color: var(--sage-dark);
  }
  .hint{ font-size:12px; color: var(--ink-soft); line-height:1.5; margin-top:2px; }

  .results-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:12px; }
  .result-card{ background:#E4EBDF; border-radius:10px; padding:10px 12px; }
  .result-card .rnum{ font-family:'Bebas Neue', sans-serif; font-size:22px; color: var(--sage-dark); line-height:1; }
  .result-card .rlbl{ font-size:10px; color: var(--sage-dark); font-weight:600; text-transform:uppercase; letter-spacing:.2px; margin-top:3px; opacity:.85; }
  .burn-line{ font-size:12px; color: var(--sage-dark); margin-top:10px; font-weight:600; }
  .guide-line{ font-size:13px; color: var(--ink); line-height:1.6; margin-top:12px; padding:10px 12px; background:#F3E9D6; border-radius:10px; }
  .disclaimer{ font-size:11px; color: var(--ink-soft); line-height:1.5; margin-top:10px; }

  .seg-wrap{ margin: 0 20px 14px; }
  .cat-tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid var(--line); }
  .seg-wrap .cat-tabs{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
  .cat-tab{
    flex:0 0 auto; font-size:12px; font-weight:600; padding:7px 12px; border-radius:999px;
    background:#EFEBE1; color: var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .cat-tab.training.active{ background: var(--rust); color:#fff; }
  .cat-tab.diet.active{ background: var(--sage); color:#fff; }
  .cat-tab.recipes.active{ background: var(--amber); color:#fff; }
  .seg-wrap .cat-tab{ flex:1; text-align:center; }

  .day-tabs-wrap{ margin: 0 20px 4px; }
  .log-card{
    background: var(--paper); border:1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin: 0 20px 14px;
  }
  .log-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .log-nav-btn{
    border:none; background:#F3EFE5; color: var(--ink-soft); width:28px; height:28px;
    border-radius:50%; font-size:16px; font-weight:700; cursor:pointer; line-height:1;
  }
  .log-nav-btn:disabled{ opacity:.35; cursor:default; }
  .log-week-label{ font-size:12px; font-weight:700; color: var(--ink-soft); text-transform:uppercase; letter-spacing:.3px; }
  .log-dots{ display:flex; justify-content:space-between; gap:6px; margin-bottom:12px; }
  .log-dot{
    flex:1; text-align:center; font-size:10px; font-weight:700; color: var(--ink-soft);
    padding:8px 0 6px; border-radius:10px; background:#F3EFE5; border:none; cursor:pointer;
    font-family:inherit;
  }
  .log-dot.done{ background: var(--rust); color:#fff; }
  .log-dot.today{ box-shadow: inset 0 0 0 2px var(--ink); }
  .log-dot.future{ opacity:.4; cursor:default; }
  .log-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .log-count{ font-size:12px; color: var(--ink-soft); font-weight:600; }
  .log-existing{
    font-size:14px; color: var(--ink); background:#F3EFE5; border-radius:10px;
    padding:12px; margin-bottom:14px;
  }
  .log-entries{ margin-bottom:12px; }
  .log-entry-line{
    display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--line);
    font-size:13px; cursor:pointer;
  }
  .log-entry-line:first-child{ border-top:none; }
  .le-day{
    flex:0 0 30px; font-weight:700; color:#fff; background: var(--rust); border-radius:6px;
    text-align:center; font-size:10px; padding:3px 0;
  }
  .le-label{ font-weight:600; color: var(--ink); }
  .day-tabs-wrap .cat-tabs{ border-bottom:none; margin-bottom:0; padding-bottom:2px; }
  .recipe-cat-wrap{ margin: 0 0 4px; }
  .recipe-cat-wrap .cat-tabs{ border-bottom:none; margin-bottom:0; padding-bottom:2px; }
  .day-heading{
    font-family:'Bebas Neue', sans-serif; font-size:15px; letter-spacing:.3px;
    color: var(--ink-soft); text-transform:uppercase; margin: 20px 0 8px;
  }
  .day-heading:first-of-type{ margin-top:6px; }
  .day-badge{
    background:#F6E3DC; color: var(--rust-dark); font-size:11px; font-weight:600;
    padding:3px 9px; border-radius:999px; border:none; cursor:pointer; margin-top:4px;
  }
  .shared-badge{
    background:#EFEBE1; color: var(--ink-soft); font-size:11px; font-weight:600;
    padding:3px 9px; border-radius:999px; border:none; cursor:pointer; margin-top:4px;
  }
  .shared-badge.active{ background:#E4EBDF; color: var(--sage-dark); }
  .day-pick-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:6px; margin-bottom:12px; }
  .day-pick-btn{
    text-align:center; padding:9px 0; border-radius:8px; border:1px solid var(--line);
    background:#FBF9F4; font-size:12px; font-weight:600; color: var(--ink-soft); cursor:pointer;
  }
  .day-pick-btn.active{ background: var(--rust); color:#fff; border-color: var(--rust); }

  main{ flex:1; padding: 0 20px calc(30px + env(safe-area-inset-bottom)); }

  .empty{
    margin-top: 40px; text-align:center; color: var(--ink-soft);
  }
  .empty .plate-icon{ margin: 0 auto 14px; opacity:.5; }
  .empty p{ font-size:14px; line-height:1.5; max-width:260px; margin:6px auto 0; }
  .empty-add-btn{
    width:56px; height:56px; border-radius:50%; padding:0; margin:20px auto 0;
    display:block; text-align:center; line-height:56px;
    -webkit-appearance:none; appearance:none; -webkit-tap-highlight-color:transparent;
    color:#fff; font-size:32px; font-weight:300; font-family:inherit; cursor:pointer;
    box-shadow: 0 6px 16px rgba(35,35,32,0.28);
    border:none; outline:none;
  }
  .empty-add-btn.training{ background: var(--rust); }
  .empty-add-btn.diet{ background: var(--sage); }

  .plan-card{
    background: var(--paper); border:1px solid var(--line); border-radius: var(--radius);
    padding: 16px 16px 14px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .plan-card .row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .plan-card h3{ margin:0; font-size:17px; font-weight:700; }
  .plan-card .meta{ font-size:12px; color: var(--ink-soft); margin-top:2px; }
  .stripe{ width:26px; height:4px; border-radius:2px; margin: 10px 0 4px; }
  .stripe.training{ background: var(--rust); }
  .stripe.diet{ background: var(--sage); }
  .stripe.recipes{ background: var(--amber); }

  .chart-wrap{ margin: 6px 0 10px; }
  .chart-wrap svg text{ font-family:'Inter', sans-serif; }

  .item-line{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; border-top:1px solid var(--line); font-size:14px;
  }
  .item-line:first-of-type{ border-top:none; }
  .item-line .name{ font-weight:600; }
  .item-line .detail{ color: var(--ink-soft); font-size:13px; }
  .item-line-text{ cursor:pointer; flex:1; }
  .delta-up{ color: var(--sage-dark); font-weight:700; }
  .delta-down{ color: var(--danger); font-weight:700; }
  .item-line button{
    background:none; border:none; color:var(--ink-soft); font-size:18px; line-height:1;
    cursor:pointer; padding:4px 6px; margin-left:6px;
  }
  .item-line .amt{ font-weight:600; color: var(--amber-dark); font-size:13px; }

  .icon-btn{
    background:none; border:none; color: var(--ink-soft); cursor:pointer; padding:4px;
    font-size:15px;
  }
  .icon-btn.del{ color: var(--danger); }

  .add-item-row{
    display:flex; gap:6px; margin-top: 12px; flex-wrap:wrap;
  }
  .add-item-row input{
    border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-size:13px; font-family:inherit; background:#FBF9F4;
  }
  .add-item-row input.iname{ flex:1 1 100px; min-width:90px; }
  .add-item-row input.idetail{ width:76px; }
  .add-item-row input.iweight{ width:56px; }
  .add-item-row button.add{
    border:none; border-radius:8px; padding:0 14px; font-weight:700; font-size:18px;
    color:#fff; cursor:pointer;
  }
  .add-item-row.training button.add{ background: var(--rust); }
  .add-item-row.diet button.add{ background: var(--sage); }
  .lib-btn{
    border:1px dashed var(--line); border-radius:8px; padding:8px 10px; font-size:12px;
    font-weight:600; background:#FBF9F4; cursor:pointer; color: var(--ink-soft);
    width:100%; margin-top:6px; text-align:center;
  }
  .plan-card.training .lib-btn{ border-color: var(--rust); color: var(--rust-dark); }
  .plan-card.diet .lib-btn{ border-color: var(--sage); color: var(--sage-dark); }
  .cardio-btn{ margin-top:8px; }
  .recipe-add-btn{
    border:none; border-radius:8px; padding:9px 10px; font-size:12px; font-weight:700;
    background: var(--amber); color:#fff; cursor:pointer; width:100%; margin-top:10px;
  }
  .recipe-link{
    display:block; text-align:center; font-size:12px; font-weight:600; color: var(--amber-dark);
    text-decoration:none; margin-top:10px; padding:8px 0; border:1px solid var(--line); border-radius:8px;
  }
  .recipe-link:active{ background:#F3E9D6; }

  .badge{
    display:inline-block; font-size:11px; font-weight:600; padding:3px 9px;
    border-radius:999px; background:#F3E9D6; color: var(--amber-dark);
  }

  .add-plan-row{
    display:block; width:100%; margin-top:8px; padding:14px 0; border-radius: var(--radius);
    border:1px dashed var(--line); background: var(--paper); text-align:center;
    font-size:14px; font-weight:700; cursor:pointer;
  }
  .add-plan-row.training{ color: var(--rust-dark); border-color: var(--rust); }
  .add-plan-row.diet{ color: var(--sage-dark); border-color: var(--sage); }

  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(35,35,32,0.4);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:20;
  }
  .sheet{
    width:100%; max-width:430px; background: var(--paper);
    border-radius: 20px 20px 0 0; padding: 22px 20px 28px;
    max-height: 82vh; overflow-y:auto;
  }
  .sheet h4{ margin:0 0 14px; font-family:'Bebas Neue', sans-serif; font-size:22px; letter-spacing:.3px;}
  .sheet input{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:12px;
    font-size:15px; font-family:inherit; margin-bottom:10px; background:#FBF9F4;
  }
  .sheet .actions{ display:flex; gap:10px; margin-top:6px; }
  .sheet .actions button{
    flex:1; padding:12px; border-radius:10px; border:none; font-weight:700; font-size:14px; cursor:pointer;
  }
  .sheet .cancel{ background:#EFEBE1; color: var(--ink-soft); }
  .sheet .confirm.training{ background: var(--rust); color:#fff; }
  .sheet .confirm.diet{ background: var(--sage); color:#fff; }
  .err{ color: var(--danger); font-size:12px; margin: -4px 0 10px; display:none; }

  .lib-list{ display:flex; flex-direction:column; gap:6px; }
  .lib-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 12px; border-radius:10px; background:#FBF9F4; border:1px solid var(--line);
    cursor:pointer; font-size:14px;
  }
  .lib-item:active{ transform: scale(0.98); }
  .lib-item.lib-item-ex{ gap:8px; cursor:default; }
  .lib-item.lib-item-ex:active{ transform:none; }
  .lib-item-info{ flex:1; display:flex; flex-direction:column; cursor:default; }
  .lib-weight-input{
    width:52px; border:1px solid var(--line); border-radius:8px; padding:7px 6px;
    font-size:13px; font-family:inherit; background:#fff; text-align:center;
  }
  .lib-add-btn{
    border:none; border-radius:8px; width:32px; height:32px; font-size:18px; font-weight:700;
    background: var(--rust); color:#fff; cursor:pointer; flex:0 0 auto;
  }
  .weight-edit-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:4px; }
  .weight-edit-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 12px; background:#FBF9F4; border:1px solid var(--line); border-radius:10px;
  }
  .we-name{ font-size:13px; font-weight:600; }
  .we-input{
    width:60px; border:1px solid var(--line); border-radius:8px; padding:6px;
    font-size:13px; font-family:inherit; text-align:center; background:#fff;
  }
  .lib-item.selectable.selected{ background: var(--rust); border-color: var(--rust); color:#fff; }
  .lib-item.selectable.selected .d{ color: rgba(255,255,255,0.8); }
  .lib-item .n{ font-weight:600; }
  .lib-item .d{ font-size:12px; color: var(--ink-soft); }

  .plate-icon svg{ display:block; }
</style>
</head>
<body>
<div class="device">

  <header class="top">
    <div class="brand">FORM<span>.</span></div>
    <div style="text-align:right;">
      <div class="datepill" id="datepill"></div>
      <div class="sync-pill" id="syncPill"></div>
    </div>
  </header>

  <div class="profile-switch" id="profileSwitch"></div>

  <div class="tabs">
    <div class="tab training active" data-tab="training">Træning</div>
    <div class="tab diet" data-tab="diet">Kost</div>
  </div>

  <div class="stats-row" id="statsRow"></div>

  <main id="main"></main>
</div>

<script type="module">

const DAYS = ['Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag','Søndag'];

function buildKetoRecipes(){
  const list = [];
  KETO_PROTEINS.forEach((protein, i) => {
    KETO_VEG.forEach((veg, j) => {
      const fat = KETO_FATS[(i + j) % KETO_FATS.length];
      const kcalBase = Math.round(
        protein.kcal100 * protein.amt / 100 + veg.kcal100 * veg.amt / 100 + fat.kcal100 * fat.amt / 100
      );
      list.push({
        name: `${protein.name} med ${veg.name}`, category: 'Keto', sub: protein.name, kcalBase,
        ingredients: [
          { name: protein.name, base: protein.amt, unit: 'g' },
          { name: veg.name, base: veg.amt, unit: 'g' },
          { name: fat.name, base: fat.amt, unit: 'g' }
        ]
      });
    });
  });
  return list;
}

// Storage priority: cloud (Firestore, if configured) > Claude's built-in
// storage (only available inside Claude) > the browser's own localStorage.
const hasClaudeStorage = typeof window.storage !== 'undefined' && window.storage;
const localFallback = {
  async get(key){
    const v = localStorage.getItem('form-app:' + key);
    return v === null ? null : { key, value: v };
  },
  async set(key, value){
    localStorage.setItem('form-app:' + key, value);
    return { key, value };
  }
};

let store = hasClaudeStorage ? window.storage : localFallback;
let cloudDocRef = null;

if(cloudEnabled){
  const app = initializeApp(FIREBASE_CONFIG);
  const db = getFirestore(app);
  cloudDocRef = doc(db, 'form-app', 'shared');
  store = {
    async get(key){
      const snap = await getDoc(cloudDocRef);
      if(!snap.exists()) return null;
      const data = snap.data();
      return data[key] !== undefined ? { key, value: data[key] } : null;
    },
    async set(key, value){
      await setDoc(cloudDocRef, { [key]: value }, { merge: true });
      return { key, value };
    }
  };
  // Live sync: re-render automatically when the other phone saves a change.
  onSnapshot(cloudDocRef, () => { loadPlans(); });
}

async function loadPlans(){
  try{
    const res = await store.get('plans');
    state.plans = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ state.plans = []; }
  // migrate legacy plans without an owner to profile 1
  let migrated = false;
  state.plans.forEach(p => {
    if(!p.owner){ p.owner = 'p1'; migrated = true; }
    if(p.type === 'diet' && p.shared === undefined){
      p.shared = /aften/i.test(p.name);
      migrated = true;
    }
  });

  try{
    const res = await store.get('profiles');
    if(res && res.value){
      const stored = JSON.parse(res.value);
      state.profiles.p1 = Object.assign({}, state.profiles.p1, stored.p1);
      state.profiles.p2 = Object.assign({}, state.profiles.p2, stored.p2);
    } else {
      // migrate legacy single-profile storage into p1
      const legacy = await store.get('profile').catch(()=>null);
      if(legacy && legacy.value){
        const lp = JSON.parse(legacy.value);
        state.profiles.p1 = Object.assign({}, state.profiles.p1, lp, { label: 'Mand', gender: 'mand' });
        migrated = true;
      }
    }
  }catch(e){}

  try{
    const res = await store.get('trainingLog');
    if(res && res.value){
      const stored = JSON.parse(res.value);
      state.trainingLog.p1 = stored.p1 || [];
      state.trainingLog.p2 = stored.p2 || [];
    }
  }catch(e){}

  // migrate legacy log entries that were plain date strings into {date, label}
  ['p1','p2'].forEach(key => {
    state.trainingLog[key] = (state.trainingLog[key] || []).map(e =>
      typeof e === 'string' ? { date: e, label: 'Trænet' } : e
    );
  });

  if(migrated) savePlans();
  render();
}
async function savePlans(){
  try{ await store.set('plans', JSON.stringify(state.plans)); }catch(e){}
}
async function saveProfiles(){
  try{ await store.set('profiles', JSON.stringify(state.profiles)); }catch(e){}
}
async function saveTrainingLog(){
  try{ await store.set('trainingLog', JSON.stringify(state.trainingLog)); }catch(e){}
}

function barChart(data, color, opts){
  opts = opts || {};
  const maxW = opts.width || 258;
  const barH = 12, gap = 8, labelW = opts.labelW || 76;
  const max = Math.max(...data.map(d=>d.value), 1);
  let y = 2;
  let bars = '';
  data.forEach(d=>{
    const w = Math.max(2, Math.round((d.value/max) * (maxW - labelW - 34)));
    bars += `<rect x="${labelW}" y="${y}" width="${w}" height="${barH}" rx="3" fill="${color}"/>`;
    bars += `<text x="${labelW-6}" y="${y+barH-2}" font-size="10" fill="#6B6A63" text-anchor="end">${escapeHtml(d.label)}</text>`;
    bars += `<text x="${labelW+w+6}" y="${y+barH-2}" font-size="10" fill="#232320" font-weight="600">${d.value}</text>`;
    y += barH + gap;
  });
  const h = y - gap + 2;
  return `<div class="chart-wrap"><svg width="100%" viewBox="0 0 ${maxW} ${h}" style="overflow:visible; display:block;">${bars}</svg></div>`;
}

function trainingChart(plan){
  const counts = {};
  plan.items.forEach(it=>{
    const c = it.category || 'Andet';
    counts[c] = (counts[c]||0) + 1;
  });
  const data = Object.keys(counts).map(k=>({label:k, value:counts[k]})).sort((a,b)=>b.value-a.value);
  if(data.length === 0) return '';
  return barChart(data, '#C1553B');
}

function dietChart(plan){
  if(plan.items.length === 0) return '';
  const data = plan.items
    .map(it=>({label: it.name.length>12 ? it.name.slice(0,11)+'…' : it.name, value: Number(it.detail)||0}))
    .sort((a,b)=>b.value-a.value)
    .slice(0,6);
  return barChart(data, '#52684F');
}

function burnRatePerMin(weight){ return 6 * (weight / 70); } // styrketræning
const CARDIO_INTENSITY_RATES = { 'Let': 7, 'Moderat': 10, 'Hård': 13 }; // kcal/min ved 70kg
function cardioRatePerMin(weight, intensity){
  const base = CARDIO_INTENSITY_RATES[intensity] || CARDIO_INTENSITY_RATES['Moderat'];
  return base * (weight / 70);
}
function parseCardioMinutes(detail){
  const m = /([\d.]+)\s*min/i.exec(detail || '');
  return m ? parseFloat(m[1]) : 30; // antager 30 min hvis ikke angivet
}
function computePlanBurn(plan, weight){
  let total = 0;
  plan.items.forEach(it => {
    if(it.category === 'Cardio'){
      const minutes = (it.minutes != null) ? it.minutes : parseCardioMinutes(it.detail);
      total += minutes * cardioRatePerMin(weight, it.intensity);
    } else {
      total += 10 * burnRatePerMin(weight); // ~10 min pr. styrkeøvelse inkl. pauser
    }
  });
  return Math.round(total);
}
function estimateTrainingBurnPerDay(weight, ownerKey){
  const plans = state.plans.filter(p => p.type === 'training' && p.owner === ownerKey);
  let weeklyBurn = 0;
  plans.forEach(p => { weeklyBurn += computePlanBurn(p, weight); });
  return weeklyBurn / 7;
}

function calcProfileResults(p, ownerKey){
  if(!p.weight || !p.height) return null;
  const age = p.age || 30;
  const bmr = p.gender === 'kvinde'
    ? 10 * p.weight + 6.25 * p.height - 5 * age - 161
    : 10 * p.weight + 6.25 * p.height - 5 * age + 5;
  const baseTdee = bmr * 1.4;
  const trainingBurn = Math.round(estimateTrainingBurnPerDay(p.weight, ownerKey));
  const adjustedTdee = Math.round(baseTdee + trainingBurn);
  const floor = p.gender === 'kvinde' ? 1200 : 1500;
  let target = adjustedTdee - 500;
  if (target < floor) target = floor;
  const bmi = p.weight / Math.pow(p.height / 100, 2);
  let weeksToGoal = null;
  if (p.goalWeight && p.goalWeight > 0 && p.goalWeight < p.weight) {
    weeksToGoal = Math.ceil((p.weight - p.goalWeight) / 0.5);
  }
  return { trainingBurn, tdee: adjustedTdee, target, bmi: Math.round(bmi * 10) / 10, weeksToGoal };
}

  const plans = state.trainingProgramFilter === 'Alle' ? all : all.filter(p => p.id === state.trainingProgramFilter);

  const exerciseCount = plans.reduce((s,p)=> s + p.items.length, 0);
  const weight = state.profiles[state.activeProfile].weight;
  const burnTotal = plans.reduce((s,p)=> s + computePlanBurn(p, weight), 0);

    <div class="stat-card training"><div class="num">${planCount}</div><div class="lbl">${state.trainingProgramFilter==='Alle'?'Planer i alt':'Valgt plan'}</div></div>
    <div class="stat-card training"><div class="num">${exerciseCount}</div><div class="lbl">Øvelser</div></div>
    <div class="stat-card training"><div class="num">${burnTotal}</div><div class="lbl">Kcal forbrændt</div></div>
  `;
}

function todayISO(){ return new Date().toISOString().slice(0, 10); }

// Each entry: { date: 'YYYY-MM-DD', label: 'Overkrop A' }
function getLogEntry(dateISO, ownerKey){
  return (state.trainingLog[ownerKey] || []).find(e => e.date === dateISO);
}
function isTrainedOn(dateISO, ownerKey){
  return !!getLogEntry(dateISO, ownerKey);
}

function getWeekDates(offset){
  offset = offset || 0;
  const now = new Date();
  const jsDay = now.getDay(); // 0 = søndag
  const diffToMonday = (jsDay === 0) ? -6 : 1 - jsDay;
  const monday = new Date(now);
  monday.setDate(now.getDate() + diffToMonday + offset * 7);
  const dates = [];
  for(let i = 0; i < 7; i++){
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    dates.push(d.toISOString().slice(0, 10));
  }
  return dates;
}

function setLogEntry(dateISO, label, extras){
  const key = state.activeProfile;
  if(!state.trainingLog[key]) state.trainingLog[key] = [];
  state.trainingLog[key] = state.trainingLog[key].filter(e => e.date !== dateISO);
  const entry = { date: dateISO, label };
  if(extras && extras.length) entry.extras = extras;
  state.trainingLog[key].push(entry);
  saveTrainingLog();
  render();
}

function removeLogEntry(dateISO){
  const key = state.activeProfile;
  state.trainingLog[key] = (state.trainingLog[key] || []).filter(e => e.date !== dateISO);
  saveTrainingLog();
  render();
}

  return d.toLocaleDateString('da-DK', { day: 'numeric', month: 'short' });
}
function fmtFullDate(dateISO){
  const d = new Date(dateISO + 'T00:00:00');
  return d.toLocaleDateString('da-DK', { weekday: 'long', day: 'numeric', month: 'long' });
}

function isoWeekdayName(dateISO){
  const d = new Date(dateISO + 'T00:00:00');
  const jsDay = d.getDay(); // 0 = søndag
  const idx = (jsDay === 0) ? 6 : jsDay - 1;
  return DAYS[idx];
}

function openLogEntrySheet(dateISO){
  const key = state.activeProfile;
  const existing = getLogEntry(dateISO, key);
  const plans = state.plans.filter(p => p.type === 'training' && p.owner === key);

  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';

  const existingLabels = existing ? existing.label.split(',').map(s => s.trim()).filter(Boolean) : [];
  const selected = new Set(existingLabels);

  const existingActionsHtml = existing ? `
    <div class="actions">
      <button class="cancel" id="removeLogBtn">Fjern hele markeringen</button>
    </div>` : '';

  function weightEditorHtml(){
    if(!existing) return '';
    const dayPlans = state.plans.filter(p => p.type === 'training' && p.owner === key && existingLabels.includes(p.name));
    let rows = '';
    dayPlans.forEach(plan => {
      plan.items.forEach(it => {
        if(it.category === 'Cardio') return;
        rows += `<div class="weight-edit-row" data-plan-id="${plan.id}" data-item-id="${it.id}">
          <span class="we-name">${escapeHtml(it.name)}</span>
          <input class="we-input" type="number" inputmode="decimal" placeholder="kg" value="${escapeHtml(it.weight || '')}">
        </div>`;
      });
    });
    if(!rows) return '';
    return `
      <div class="hint" style="margin:14px 0 6px;">Ret vægt for styrkeøvelser denne dag:</div>
      <div class="weight-edit-list">${rows}</div>
      <button class="lib-btn" id="saveWeightsBtn" style="margin-top:8px;">Gem vægte</button>`;
  }

  const planListHtml = plans.length ? `
    <div class="lib-list" id="logPlanList">` + plans.map(p => `
      <div class="lib-item selectable ${selected.has(p.name) ? 'selected' : ''}" data-plan-name="${escapeHtml(p.name)}">
        <span class="n">${escapeHtml(p.name)}</span>
        <span class="d">${p.items.length} øvelser</span>
      </div>`).join('') + `</div>` : '';

  const weekdayForHint = isoWeekdayName(dateISO);
  const hasDayPlan = plans.some(p => p.day === weekdayForHint);
  const customHint = hasDayPlan
    ? `Skrives den ind som cardio i den plan, der ligger på ${weekdayForHint.toLowerCase()}:`
    : `Eller skriv selv, fx Løbetur (der er ingen plan sat til ${weekdayForHint.toLowerCase()}, så det gemmes kun i kalenderen):`;

  let extras = existing && existing.extras ? existing.extras.slice() : [];

  backdrop.innerHTML = `
    <div class="sheet">
      <h4>${fmtFullDate(dateISO)}</h4>
      ${existing ? `<div class="log-existing">Trænet: <strong id="selectedSummary">${escapeHtml(existing.label)}</strong></div>` : ''}
      ${existingActionsHtml}
      ${weightEditorHtml()}
      ${plans.length ? '<div class="hint" style="margin: 14px 0 8px;">Vælg en eller flere planer, I trænede:</div>' + planListHtml : ''}
      <button class="add-plan-row training" id="logCreatePlanBtn">+ Opret ny plan</button>
      <div class="hint" style="margin: 14px 0 6px;">${customHint}</div>
      <input id="logCustomLabel" placeholder="fx Løbetur">
      <div class="hint" style="margin: 14px 0 6px;">Tilføj en øvelse kun for denne dag (gemmes ikke i en fast plan):</div>
      <div id="extrasList"></div>
      <div class="add-item-row training">
        <input class="iname" id="extraName" placeholder="Øvelse">
        <input class="idetail" id="extraDetail" placeholder="fx 4x8">
        <input class="iweight" id="extraWeight" placeholder="kg" inputmode="decimal">
        <button class="add" id="extraAddBtn" aria-label="Tilføj">+</button>
      </div>
      <div class="actions">
        <button class="cancel" id="cancelLogSheet">${existing ? 'Luk' : 'Annuller'}</button>
        <button class="confirm training" id="confirmLogSheet">Gem</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', (e) => { if(e.target === backdrop) backdrop.remove(); });

  function renderExtras(){
    const list = document.getElementById('extrasList');
    if(!extras.length){ list.innerHTML = ''; return; }
    list.innerHTML = `<div class="log-entries">` + extras.map((ex, i) => `
      <div class="item-line">
        <div>
          <div class="name">${escapeHtml(ex.name)}</div>
          <div class="detail">${escapeHtml(ex.detail || '')}${ex.weight ? ' · ' + escapeHtml(ex.weight) + ' kg' : ''}</div>
        </div>
        <button data-extra-idx="${i}" aria-label="Fjern">×</button>
      </div>`).join('') + `</div>`;
    list.querySelectorAll('[data-extra-idx]').forEach(b => {
      b.addEventListener('click', () => { extras.splice(Number(b.dataset.extraIdx), 1); renderExtras(); });
    });
  }
  renderExtras();

  document.getElementById('extraAddBtn').addEventListener('click', () => {
    const nameEl = document.getElementById('extraName');
    const name = nameEl.value.trim();
    if(!name){ nameEl.focus(); return; }
    extras.push({
      id: uid(), name,
      detail: document.getElementById('extraDetail').value.trim(),
      weight: document.getElementById('extraWeight').value.trim()
    });
    nameEl.value = ''; document.getElementById('extraDetail').value = ''; document.getElementById('extraWeight').value = '';
    renderExtras();
    nameEl.focus();
  });

  const createPlanBtn = document.getElementById('logCreatePlanBtn');
  if(createPlanBtn){
    createPlanBtn.addEventListener('click', () => {
      backdrop.remove();
      openNewPlanSheet(weekdayForHint, () => openLogEntrySheet(dateISO));
    });
  }

  const saveWeightsBtn = document.getElementById('saveWeightsBtn');
  if(saveWeightsBtn){
    saveWeightsBtn.addEventListener('click', () => {
      let changed = false;
      document.querySelectorAll('.weight-edit-row').forEach(row => {
        const val = row.querySelector('.we-input').value.trim();
        if(!val) return;
        const plan = state.plans.find(p => p.id === row.dataset.planId);
        const item = plan && plan.items.find(it => it.id === row.dataset.itemId);
        if(!item) return;
        item.weight = val;
        if(!item.weightHistory) item.weightHistory = [];
        const idx = item.weightHistory.findIndex(h => h.date === dateISO);
        if(idx >= 0) item.weightHistory[idx].weight = val;
        else item.weightHistory.push({ date: dateISO, weight: val });
        changed = true;
      });
      if(changed) savePlans();
      backdrop.remove();
      render();
    });
  }

  const removeBtn = document.getElementById('removeLogBtn');
  if(removeBtn) removeBtn.addEventListener('click', () => { removeLogEntry(dateISO); backdrop.remove(); });

  const cancelBtn = document.getElementById('cancelLogSheet');
  if(cancelBtn) cancelBtn.addEventListener('click', () => backdrop.remove());

  backdrop.querySelectorAll('.lib-item.selectable').forEach(el => {
    el.addEventListener('click', () => {
      const name = el.dataset.planName;
      if(selected.has(name)){ selected.delete(name); el.classList.remove('selected'); }
      else { selected.add(name); el.classList.add('selected'); }
    });
  });

  const confirmBtn = document.getElementById('confirmLogSheet');
  if(confirmBtn){
    confirmBtn.addEventListener('click', () => {
      const input = document.getElementById('logCustomLabel');
      const customLabel = input.value.trim();
      const parts = Array.from(selected);
      if(customLabel) parts.push(customLabel);
      extras.forEach(ex => parts.push(ex.name));
      if(parts.length === 0){ input.focus(); return; }

      // Selvskrevet tekst lægges ind som en rigtig cardio-linje i dagens plan, hvis der er en.
      if(customLabel){
        const weekday = isoWeekdayName(dateISO);
        const dayPlan = state.plans.find(p => p.type === 'training' && p.owner === key && p.day === weekday);
        if(dayPlan){
          dayPlan.items.push({
            id: uid(), name: customLabel, category: 'Cardio', minutes: 30, intensity: 'Moderat',
            detail: '30 min · Moderat'
          });
          savePlans();
        }
      }

      setLogEntry(dateISO, parts.join(', '), extras);
      backdrop.remove();
    });
  }
}

function trainingLogCardHtml(){
  const key = state.activeProfile;
  const offset = state.logWeekOffset || 0;
  const weekDates = getWeekDates(offset);
  const today = todayISO();
  const count = weekDates.filter(d => isTrainedOn(d, key)).length;
  const dots = weekDates.map((d, i) => {
    const trained = isTrainedOn(d, key);
    const isToday = d === today;
    const isFuture = d > today;
    return `<button class="log-dot ${trained ? 'done' : ''} ${isToday ? 'today' : ''} ${isFuture ? 'future' : ''}" data-log-date="${d}" ${isFuture ? 'disabled' : ''}>${DAY_SHORT[i]}</button>`;
  }).join('');
  const weekLabel = offset === 0 ? 'Denne uge' : `${fmtShortDate(weekDates[0])} – ${fmtShortDate(weekDates[6])}`;

  const entryLines = weekDates.map((d, i) => {
    const entry = getLogEntry(d, key);
    if(!entry) return '';
    return `<div class="log-entry-line" data-log-date="${d}"><span class="le-day">${DAY_SHORT[i]}</span><span class="le-label">${escapeHtml(entry.label)}</span></div>`;
  }).join('');
  const entriesHtml = entryLines ? `<div class="log-entries">${entryLines}</div>` : '';

  return `
    <div class="log-card">
      <div class="log-nav">
        <button class="log-nav-btn" id="logWeekPrev" aria-label="Forrige uge">‹</button>
        <div class="log-week-label">${weekLabel}</div>
        <button class="log-nav-btn" id="logWeekNext" aria-label="N\u00e6ste uge" ${offset >= 0 ? 'disabled' : ''}>›</button>
      </div>
      <div class="log-dots">${dots}</div>
      ${entriesHtml}
      <div class="log-row">
        <div class="log-count">${count} af 7 dage trænet</div>
      </div>
    </div>`;
}


function programTabsHtml(programs){
  const tabs = [{ id: 'Alle', label: 'Alle' }].concat(
    programs.map(p => ({ id: p.id, label: p.name.length > 14 ? p.name.slice(0, 13) + '…' : p.name }))
  );
  return `<div class="day-tabs-wrap"><div class="cat-tabs">` + tabs.map(t =>
    `<div class="cat-tab training ${state.trainingProgramFilter===t.id?'active':''}" data-program="${t.id}">${escapeHtml(t.label)}</div>`
  ).join('') + `</div></div>`;
}

function renderTrainingTab(main){
  const all = state.plans.filter(p => p.type === 'training' && p.owner === state.activeProfile);

  // hvis den valgte plan er slettet, eller ikke findes for denne profil, gå tilbage til "Alle"
  if(state.trainingProgramFilter !== 'Alle' && !all.some(p => p.id === state.trainingProgramFilter)){
    state.trainingProgramFilter = 'Alle';
  }

  let html = trainingLogCardHtml() + programTabsHtml(all);

  if(all.length === 0){
    html += emptyStateHtml(`Ingen træningsplaner endnu for ${state.profiles[state.activeProfile].label.toLowerCase()}. Tryk på + for at oprette den første.`, 'training');
    main.innerHTML = html;
    attachEmptyAddButton();
    main.querySelectorAll('.day-tabs-wrap .cat-tab').forEach(el => {
      el.addEventListener('click', () => { state.trainingProgramFilter = el.dataset.program; render(); });
    });
    return;
  }

  if(state.trainingProgramFilter !== 'Alle'){
    const plan = all.find(p => p.id === state.trainingProgramFilter);
    html += planCardHtml(plan) + addPlanRowHtml('training', 'Ny plan');
    main.innerHTML = html;
    attachPlanListeners([plan]);
  } else {
    let body = '';
    DAYS.forEach(day => {
      const dayPlans = all.filter(p => p.day === day);
      if(dayPlans.length){
        body += `<div class="day-heading">${day}</div>` + dayPlans.map(p => planCardHtml(p)).join('');
      }
    });
    const unassigned = all.filter(p => !p.day);
    if(unassigned.length){
      body += `<div class="day-heading">Ikke tildelt</div>` + unassigned.map(p => planCardHtml(p)).join('');
    }
    body += addPlanRowHtml('training', 'Ny plan');
    main.innerHTML = html + body;
    attachPlanListeners(all);
  }

  main.querySelectorAll('.day-tabs-wrap .cat-tab').forEach(el => {
    el.addEventListener('click', () => { state.trainingProgramFilter = el.dataset.program; render(); });
  });
  main.querySelectorAll('.day-badge').forEach(el => {
    el.addEventListener('click', () => openDaySheet(el.dataset.plan));
  });
  attachEmptyAddButton();
}

function guideText(profile, results){
  if(!results) return '';
  const name = profile.label;
  if(results.weeksToGoal){
    return `${name} sigter mod ${profile.goalWeight} kg fra ${profile.weight} kg — ca. ${results.weeksToGoal} uger med ${results.target} kcal/dag og de træningsplaner, der er lagt ind under ${name}s fane.`;
  }
  return `Sæt en målvægt for ${name} for at få en personlig tidslinje til vægttabet.`;
}

  const p = state.profiles[key];
  const results = calcProfileResults(p, key);

  let html = `
    <div class="profile-card">
      <div class="ptitle">${escapeHtml(p.label)}s profil</div>
      <div class="field-grid">
        <div class="field">
          <label>Vægt (kg)</label>

        </div>
        <div class="field">
          <label>Højde (cm)</label>
          <input type="number" inputmode="numeric" id="fHeight" min="120" max="230" step="1" value="${p.height}">
        </div>
        <div class="field">
          <label>Alder (år)</label>
          <input type="number" inputmode="numeric" id="fAge" min="14" max="99" step="1" value="${p.age || ''}" placeholder="valgfri">
        </div>

      ${results ? `
        <div class="results-grid">
          <div class="result-card"><div class="rnum">${results.target}</div><div class="rlbl">Kcal-mål/dag</div></div>
          <div class="result-card"><div class="rnum">${results.tdee}</div><div class="rlbl">Vedligehold/dag</div></div>
          <div class="result-card"><div class="rnum">${results.bmi}</div><div class="rlbl">BMI</div></div>
          <div class="result-card"><div class="rnum">${results.weeksToGoal ? results.weeksToGoal + ' uger' : '—'}</div><div class="rlbl">Til målvægt</div></div>
        </div>
        <div class="burn-line">${results.trainingBurn > 0 ? `${escapeHtml(p.label)}s træningsplaner lægger ca. ${results.trainingBurn} kcal/dag oven i vedligeholdelsesbehovet.` : `Tilføj træningsplaner under ${escapeHtml(p.label)} på Træning-fanen for at lægge forbruget oven i kaloriemålet.`}</div>
        <div class="guide-line">${guideText(p, results)}</div>
        <div class="disclaimer">Skøn baseret på Mifflin-St Jeor-formlen, moderat aktivitetsniveau, den valgte profils styrke- og cardiotræning og et sikkert ugentligt vægttab på ca. 0,5 kg pr. person. Ikke medicinsk rådgivning — tal med en læge eller diætist ved større vægttab.</div>
      ` : ''}
    </div>

    <div class="seg-wrap">
      <div class="cat-tabs">
        <div class="cat-tab diet ${state.dietView==='plans'?'active':''}" data-view="plans">Mine planer</div>
        <div class="cat-tab diet ${state.dietView==='recipes'?'active':''}" data-view="recipes">Opskrifter</div>
      </div>
    </div>
  `;

  main.innerHTML = html;

  const commit = () => {
    const w = Number(document.getElementById('fWeight').value);
    const h = Number(document.getElementById('fHeight').value);
    const a = Number(document.getElementById('fAge').value);
    const g = Number(document.getElementById('fGoal').value);
    const prof = state.profiles[key];
    if(w > 0) prof.weight = w;
    if(h > 0) prof.height = h;
    prof.age = a > 0 ? a : null;
    prof.goalWeight = g > 0 ? g : null;

  };
  ['fWeight','fHeight','fAge','fGoal'].forEach(id => {

  });

function renderDietPlans(container){
  const plans = state.plans.filter(p => p.type === 'diet' && (p.owner === state.activeProfile || p.shared));
  if(plans.length === 0){
    container.innerHTML = emptyStateHtml(`Ingen kostplaner endnu for ${state.profiles[state.activeProfile].label.toLowerCase()}. Tryk på + for at oprette en, eller tilføj en ret direkte fra Opskrifter.`, 'diet');
    attachEmptyAddButton();
    return;
  }
  container.innerHTML = plans.map(p => planCardHtml(p)).join('') + addPlanRowHtml('diet', 'Ny kostplan');
  attachPlanListeners(plans);
  attachEmptyAddButton();
}

function attachEmptyAddButton(){
  document.querySelectorAll('[data-empty-add]').forEach(btn => {
    btn.addEventListener('click', () => openNewPlanSheet());
  });
  document.querySelectorAll('[data-add-plan]').forEach(btn => {
    btn.addEventListener('click', () => openNewPlanSheet());
  });
  document.querySelectorAll('[data-log-date]').forEach(btn => {
    btn.addEventListener('click', () => openLogEntrySheet(btn.dataset.logDate));
  });
  const prevBtn = document.getElementById('logWeekPrev');
  if(prevBtn) prevBtn.addEventListener('click', () => { state.logWeekOffset = (state.logWeekOffset || 0) - 1; render(); });
  const nextBtn = document.getElementById('logWeekNext');
  if(nextBtn) nextBtn.addEventListener('click', () => { state.logWeekOffset = Math.min(0, (state.logWeekOffset || 0) + 1); render(); });
}

function attachPlanListeners(plans){
  plans.forEach(p => {
    const addBtn = document.getElementById('addbtn-' + p.id);
    const nameInput = document.getElementById('name-' + p.id);
    const detailInput = document.getElementById('detail-' + p.id);
    const weightInput = document.getElementById('weight-' + p.id);
    if(addBtn) addBtn.addEventListener('click', () => addItem(p.id, nameInput, detailInput, null, weightInput));
    [nameInput, detailInput, weightInput].forEach(inp => {
      if(inp) inp.addEventListener('keydown', e => { if(e.key === 'Enter') addItem(p.id, nameInput, detailInput, null, weightInput); });
    });
    const libBtn = document.getElementById('libbtn-' + p.id);
    if(libBtn) libBtn.addEventListener('click', () => openLibrarySheet(p.id));
    const cardioBtn = document.getElementById('cardiobtn-' + p.id);
    if(cardioBtn) cardioBtn.addEventListener('click', () => openCardioSheet(p.id));
    document.querySelectorAll(`.del-plan-${p.id}`).forEach(b=> b.addEventListener('click', ()=> deletePlan(p.id)));
    document.querySelectorAll(`[data-del-item][data-plan="${p.id}"]`).forEach(b=>
      b.addEventListener('click', ()=> deleteItem(p.id, b.dataset.delItem)));
    document.querySelectorAll(`[data-edit-item][data-edit-plan="${p.id}"]`).forEach(el=>
      el.addEventListener('click', ()=> openEditItemSheet(p.id, el.dataset.editItem)));
    const dayBadge = document.getElementById('daybadge-' + p.id);
    if(dayBadge) dayBadge.addEventListener('click', () => openDaySheet(p.id));
    const sharedBadge = document.getElementById('sharedbadge-' + p.id);
    if(sharedBadge) sharedBadge.addEventListener('click', () => toggleShared(p.id));
  });
}

function toggleShared(planId){
  const plan = state.plans.find(p => p.id === planId);
  plan.shared = !plan.shared;
  savePlans();
  render();
}

function renderRecipes(container){
  const weight = state.profiles[state.activeProfile].weight;
  const factor = weight / REF_WEIGHT;
  const filtered = state.recipeCat === 'Alle' ? ALL_RECIPES : ALL_RECIPES.filter(r => r.category === state.recipeCat);

  const catTabsHtml = `<div class="recipe-cat-wrap"><div class="cat-tabs">` + RECIPE_CATS.map(c =>
    `<div class="cat-tab recipes ${state.recipeCat===c?'active':''}" data-rcat="${c}">${c}${c==='Keto' ? ' (100)' : ''}</div>`
  ).join('') + `</div></div>`;

  const cardsHtml = filtered.map((r) => {
    const idx = ALL_RECIPES.indexOf(r);
    const kcal = Math.round(r.kcalBase * factor);
    const ingHtml = r.ingredients.map(ing => `
      <div class="item-line">
        <div class="name">${escapeHtml(ing.name)}</div>
        <div class="amt">${fmtAmount(ing.base * factor)} ${escapeHtml(ing.unit)}</div>
      </div>`).join('');
    return `
      <div class="plan-card recipes">
        <div class="row">
          <div>
            <h3>${escapeHtml(r.name)}</h3>
            <div class="meta"><span class="badge">${escapeHtml(r.category)}</span>${r.sub ? ' &nbsp;·&nbsp; '+escapeHtml(r.sub) : ''} &nbsp; ~${kcal} kcal</div>
          </div>
        </div>
        <div class="stripe recipes"></div>
        ${ingHtml}
        <a class="recipe-link" href="https://www.google.com/search?q=${encodeURIComponent(r.name + ' opskrift')}" target="_blank" rel="noopener">Find opskriften på nettet ↗</a>
        <button class="recipe-add-btn" data-recipe-idx="${idx}">Tilføj til kostplan</button>
      </div>`;
  }).join('');

  container.innerHTML = catTabsHtml + (cardsHtml || `<div class="empty"><p>Ingen opskrifter i denne kategori.</p></div>`);

  container.querySelectorAll('.recipe-cat-wrap .cat-tab').forEach(el => {
    el.addEventListener('click', () => { state.recipeCat = el.dataset.rcat; render(); });
  });
  container.querySelectorAll('.recipe-add-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const r = ALL_RECIPES[Number(btn.dataset.recipeIdx)];
      const kcal = Math.round(r.kcalBase * factor);
      openAddRecipeSheet(r, kcal);
    });
  });
}

function openAddRecipeSheet(recipe, kcal){
  const dietPlans = state.plans.filter(p => p.type === 'diet' && (p.owner === state.activeProfile || p.shared));
  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';

  const listHtml = dietPlans.length
    ? `<div class="lib-list" id="recipePlanList">` + dietPlans.map(p => `
        <div class="lib-item" data-plan-id="${p.id}">
          <span class="n">${escapeHtml(p.name)}</span>
          <span class="d">${p.items.length} måltider</span>
        </div>`).join('') + `</div>`
    : `<p class="hint" style="margin-bottom:10px;">Ingen kostplaner endnu for ${escapeHtml(state.profiles[state.activeProfile].label)} — opret en herunder.</p>`;

  backdrop.innerHTML = `
    <div class="sheet">
      <h4>Tilføj "${escapeHtml(recipe.name)}"</h4>
      ${listHtml}
      <input id="recipeNewPlanName" placeholder="Ny kostplan, fx Hverdagsmenu">
      <div class="actions">
        <button class="cancel" id="cancelRecipeSheet">Luk</button>
        <button class="confirm diet" id="confirmRecipeSheet">Opret & tilføj</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', (e) => { if(e.target === backdrop) backdrop.remove(); });
  document.getElementById('cancelRecipeSheet').addEventListener('click', () => backdrop.remove());

  backdrop.querySelectorAll('.lib-item').forEach(el => {
    el.addEventListener('click', () => {
      const plan = state.plans.find(p => p.id === el.dataset.planId);
      plan.items.push({ id: uid(), name: recipe.name, detail: String(kcal), category: recipe.category });
      savePlans();
      backdrop.remove();
      render();
    });
  });

  document.getElementById('confirmRecipeSheet').addEventListener('click', () => {
    const nameInput = document.getElementById('recipeNewPlanName');
    const name = nameInput.value.trim();
    if(!name){ nameInput.focus(); return; }
    const plan = { id: uid(), type: 'diet', name, items: [], owner: state.activeProfile, shared: /aften/i.test(name) };
    plan.items.push({ id: uid(), name: recipe.name, detail: String(kcal), category: recipe.category });
    state.plans.push(plan);
    savePlans();
    backdrop.remove();
    render();
  });
}

function weightDeltaText(item){
  if(!item.weightHistory || item.weightHistory.length < 2) return '';
  const sorted = [...item.weightHistory].sort((a, b) => a.date.localeCompare(b.date));
  const last = sorted[sorted.length - 1];
  const prev = sorted[sorted.length - 2];
  const diff = parseFloat(last.weight) - parseFloat(prev.weight);
  if(isNaN(diff) || diff === 0) return '';
  const sign = diff > 0 ? '+' : '';
  const cls = diff > 0 ? 'delta-up' : 'delta-down';
  return `<span class="${cls}"> (${sign}${diff} kg)</span>`;
}

function planCardHtml(p){
  const isTraining = p.type === 'training';
  const weight = state.profiles[p.owner] ? state.profiles[p.owner].weight : state.profiles[state.activeProfile].weight;
  const detailPlaceholder = isTraining ? 'fx 4x8' : 'kcal';
  const chart = isTraining ? trainingChart(p) : dietChart(p);
  const itemsHtml = p.items.length
    ? p.items.map(it => {
        let detailText = '';
        if(isTraining){
          detailText = escapeHtml(it.detail || '');
          if(it.weight) detailText += (detailText ? ' · ' : '') + escapeHtml(it.weight) + ' kg' + weightDeltaText(it);
        } else {
          detailText = it.detail ? escapeHtml(it.detail) + ' kcal' : '';
        }
        return `
      <div class="item-line">
        <div class="${isTraining ? 'item-line-text' : ''}" ${isTraining ? `data-edit-item="${it.id}" data-edit-plan="${p.id}"` : ''}>
          <div class="name">${escapeHtml(it.name)}</div>
          <div class="detail">${detailText}</div>
        </div>
        <button data-del-item="${it.id}" data-plan="${p.id}" aria-label="Fjern">×</button>
      </div>`;
      }).join('')
    : `<div class="detail" style="padding:6px 0 2px;">Ingen ${isTraining ? 'øvelser' : 'måltider'} tilføjet endnu.</div>`;

  const dayBadgeHtml = isTraining
    ? `<button class="day-badge" id="daybadge-${p.id}" data-plan="${p.id}">${p.day ? escapeHtml(p.day) : 'Sæt ugedag'}</button>`
    : `<button class="shared-badge ${p.shared?'active':''}" id="sharedbadge-${p.id}" data-plan="${p.id}">${p.shared ? 'Fælles for begge' : 'Kun ' + escapeHtml(state.profiles[p.owner] ? state.profiles[p.owner].label : '')}</button>`;

  const burnText = isTraining && p.items.length
    ? ` · ~${computePlanBurn(p, weight)} kcal forbrændt`
    : '';

  return `
    <div class="plan-card ${p.type}">
      <div class="row">
        <div>
          <h3>${escapeHtml(p.name)}</h3>
          <div class="meta">${p.items.length} ${isTraining ? (p.items.length===1?'øvelse':'øvelser') : (p.items.length===1?'måltid':'måltider')}${burnText}</div>
          ${dayBadgeHtml}
        </div>
        <button class="icon-btn del del-plan-${p.id}" aria-label="Slet plan">✕</button>
      </div>
      <div class="stripe ${p.type}"></div>
      ${chart}
      ${itemsHtml}
      <div class="add-item-row ${p.type}">
        <input class="iname" id="name-${p.id}" placeholder="${isTraining ? 'Øvelse' : 'Måltid'}">
        <input class="idetail" id="detail-${p.id}" placeholder="${detailPlaceholder}" ${isTraining?'':'inputmode="numeric"'}>
        ${isTraining ? `<input class="iweight" id="weight-${p.id}" placeholder="kg" inputmode="decimal">` : ''}
        <button class="add" id="addbtn-${p.id}" aria-label="Tilføj">+</button>
      </div>
      <button class="lib-btn" id="libbtn-${p.id}">Vælg fra bibliotek</button>
      ${isTraining ? `<button class="lib-btn cardio-btn" id="cardiobtn-${p.id}">Tilføj cardio</button>` : ''}
    </div>`;
}

function addItem(planId, nameInput, detailInput, category, weightInput){
  const name = nameInput.value.trim();
  if(!name){ nameInput.focus(); return; }
  const plan = state.plans.find(p => p.id === planId);
  const item = { id: uid(), name, detail: detailInput.value.trim(), category: category || null };
  if(weightInput && weightInput.value.trim()){
    item.weight = weightInput.value.trim();
    item.weightHistory = [{ date: todayISO(), weight: item.weight }];
  }
  plan.items.push(item);
  nameInput.value = ''; detailInput.value = '';
  if(weightInput) weightInput.value = '';
  savePlans();
  render();
}

function openEditItemSheet(planId, itemId){
  const plan = state.plans.find(p => p.id === planId);
  const item = plan.items.find(it => it.id === itemId);
  if(!item) return;

  const history = (item.weightHistory || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  const historyHtml = history.length ? `
    <div class="hint" style="margin: 4px 0 6px;">Vægt-historik:</div>
    <div class="log-entries">` + history.slice(0, 10).map(h => `
      <div class="log-entry-line" style="cursor:default;">
        <span class="le-day">${fmtShortDate(h.date)}</span>
        <span class="le-label">${escapeHtml(h.weight)} kg</span>
      </div>`).join('') + `</div>` : '';

  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.innerHTML = `
    <div class="sheet">
      <h4>${escapeHtml(item.name)}</h4>
      <input id="editItemDetail" placeholder="fx 4x8" value="${escapeHtml(item.detail || '')}">
      <input id="editItemWeight" placeholder="kg" inputmode="decimal" value="${escapeHtml(item.weight || '')}">
      ${historyHtml}
      <div class="actions">
        <button class="cancel" id="cancelEditItem">Annuller</button>
        <button class="confirm training" id="confirmEditItem">Gem</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', (e) => { if(e.target === backdrop) backdrop.remove(); });
  document.getElementById('cancelEditItem').addEventListener('click', () => backdrop.remove());

  document.getElementById('confirmEditItem').addEventListener('click', () => {
    const detail = document.getElementById('editItemDetail').value.trim();
    const weightVal = document.getElementById('editItemWeight').value.trim();
    item.detail = detail;
    if(weightVal){
      item.weight = weightVal;
      if(!item.weightHistory) item.weightHistory = [];
      const today = todayISO();
      const idx = item.weightHistory.findIndex(h => h.date === today);
      if(idx >= 0) item.weightHistory[idx].weight = weightVal;
      else item.weightHistory.push({ date: today, weight: weightVal });
    }
    savePlans();
    backdrop.remove();
    render();
  });
}

function deleteItem(planId, itemId){
  const plan = state.plans.find(p => p.id === planId);
  plan.items = plan.items.filter(it => it.id !== itemId);
  savePlans();
  render();
}

function deletePlan(planId){
  state.plans = state.plans.filter(p => p.id !== planId);
  savePlans();
  render();
}


function openNewPlanSheet(presetDay, onDone){
  const tab = state.tab;
  let selectedDay = presetDay || null;

  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  const dayPickerHtml = tab === 'training' ? `
    <div class="field" style="margin-bottom:2px;">
      <label>Ugedag (valgfri)</label>
    </div>
    <div class="day-pick-grid" id="dayPickGrid">
      ${DAYS.map(d => `<div class="day-pick-btn ${selectedDay===d?'active':''}" data-day="${d}">${d.slice(0,3)}</div>`).join('')}
    </div>` : '';

  let sharedSelected = false;
  const sharedPickerHtml = tab === 'diet' ? `
    <div class="field" style="margin-bottom:2px;">
      <label>Synlighed</label>
    </div>
    <div class="day-pick-grid" style="grid-template-columns: 1fr 1fr;" id="sharedPickGrid">
      <div class="day-pick-btn active" data-shared="0">Kun ${escapeHtml(state.profiles[state.activeProfile].label)}</div>
      <div class="day-pick-btn" data-shared="1">Fælles for begge</div>
    </div>` : '';

  backdrop.innerHTML = `
    <div class="sheet">
      <h4>Ny ${tab === 'training' ? 'træningsplan' : 'kostplan'} — ${escapeHtml(state.profiles[state.activeProfile].label)}</h4>
      <input id="newPlanName" placeholder="${tab === 'training' ? 'fx Overkrop A' : 'fx Hverdagsmenu'}">
      <div class="err" id="newPlanErr">Skriv et navn til planen først.</div>
      ${dayPickerHtml}
      ${sharedPickerHtml}
      <div class="actions">
        <button class="cancel" id="cancelSheet">Annuller</button>
        <button class="confirm ${tab}" id="confirmSheet">Opret plan</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const input = document.getElementById('newPlanName');
  input.focus();
  const cancelAction = () => { backdrop.remove(); if(onDone) onDone(); };
  document.getElementById('cancelSheet').addEventListener('click', cancelAction);
  backdrop.addEventListener('click', (e) => { if(e.target === backdrop) cancelAction(); });

  if(tab === 'training'){
    backdrop.querySelectorAll('.day-pick-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedDay = (selectedDay === btn.dataset.day) ? null : btn.dataset.day;
        backdrop.querySelectorAll('.day-pick-btn').forEach(b => b.classList.toggle('active', b.dataset.day === selectedDay));
      });
    });
  }
  if(tab === 'diet'){
    backdrop.querySelectorAll('#sharedPickGrid .day-pick-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        sharedSelected = btn.dataset.shared === '1';
        backdrop.querySelectorAll('#sharedPickGrid .day-pick-btn').forEach(b => b.classList.toggle('active', b === btn));
      });
    });
  }

  const confirm = () => {
    const name = input.value.trim();
    const err = document.getElementById('newPlanErr');
    if(!name){ err.style.display = 'block'; input.focus(); return; }
    const plan = { id: uid(), type: tab, name, items: [], owner: state.activeProfile };
    if(tab === 'training') plan.day = selectedDay;
    if(tab === 'diet') plan.shared = sharedSelected;
    state.plans.push(plan);
    savePlans();
    backdrop.remove();
    if(onDone){ onDone(); } else { render(); }
  };
  document.getElementById('confirmSheet').addEventListener('click', confirm);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') confirm(); });
}

function openLibrarySheet(planId){
  const plan = state.plans.find(p => p.id === planId);
  const lib = plan.type === 'training' ? EXERCISE_LIBRARY : FOOD_LIBRARY;
  const cats = Object.keys(lib);
  let activeCat = cats[0];

  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.innerHTML = `
    <div class="sheet">
      <h4>${plan.type === 'training' ? 'Vælg øvelse' : 'Vælg måltid'}</h4>
      <div class="cat-tabs" id="catTabs"></div>
      <div class="lib-list" id="libList"></div>
      <div class="actions">
        <button class="cancel" id="cancelLib">Luk</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', (e) => { if(e.target === backdrop) backdrop.remove(); });
  document.getElementById('cancelLib').addEventListener('click', () => backdrop.remove());

  function renderCatTabs(){
    document.getElementById('catTabs').innerHTML = cats.map(c =>
      `<div class="cat-tab ${plan.type} ${c===activeCat?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</div>`
    ).join('');
    document.querySelectorAll('#catTabs .cat-tab').forEach(el=>{
      el.addEventListener('click', ()=>{ activeCat = el.dataset.cat; renderCatTabs(); renderList(); });
    });
  }

  function renderList(){
    const items = lib[activeCat];
    if(plan.type === 'training'){
      document.getElementById('libList').innerHTML = items.map((it, idx) => `
        <div class="lib-item lib-item-ex">
          <div class="lib-item-info" data-idx="${idx}">
            <span class="n">${escapeHtml(it.name)}</span>
            <span class="d">${escapeHtml(it.detail)}</span>
          </div>
          <input class="lib-weight-input" type="number" inputmode="decimal" placeholder="kg" id="libweight-${idx}">
          <button class="lib-add-btn" data-idx="${idx}" aria-label="Tilføj">+</button>
        </div>`).join('');
      document.querySelectorAll('#libList .lib-add-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const it = items[btn.dataset.idx];
          const weightVal = document.getElementById('libweight-' + btn.dataset.idx).value.trim();
          const item = { id: uid(), name: it.name, detail: it.detail, category: activeCat };
          if(weightVal){
            item.weight = weightVal;
            item.weightHistory = [{ date: todayISO(), weight: weightVal }];
          }
          plan.items.push(item);
          savePlans();
          backdrop.remove();
          render();
        });
      });
    } else {
      document.getElementById('libList').innerHTML = items.map((it, idx) => `
        <div class="lib-item" data-idx="${idx}">
          <span class="n">${escapeHtml(it.name)}</span>
          <span class="d">${escapeHtml(it.detail)} kcal</span>
        </div>`).join('');
      document.querySelectorAll('#libList .lib-item').forEach(el=>{
        el.addEventListener('click', ()=>{
          const it = items[el.dataset.idx];
          plan.items.push({ id: uid(), name: it.name, detail: it.detail, category: activeCat });
          savePlans();
          backdrop.remove();
          render();
        });
      });
    }
  }

  renderCatTabs();
  renderList();
}
